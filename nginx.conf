server {
    listen 80;
    server_name couplehub.furkanerdogan.com;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Serve CSS / static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Named pages (without .html extension)
    location = /privacy        { try_files /privacy.html =404; }
    location = /terms          { try_files /terms.html =404; }
    location = /faq            { try_files /faq.html =404; }
    location = /contact        { try_files /contact.html =404; }
    location = /account-deletion { try_files /account-deletion.html =404; }

    # Root
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript text/plain;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
